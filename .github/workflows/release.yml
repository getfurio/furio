# Publishes the furio CLI to npm when a release tag is pushed (vX.Y.Z), never moved afterwards, with npm trusted
# publishing (OIDC): no npm token in the repo. The tag must match packages/cli/package.json and sit on main.
#
# Two jobs, so that what can publish runs no code of the repo or of its dependencies:
#   build    checks, builds and packs the tarball, then tries it. No OIDC token, no secrets, no cache.
#   publish  uploads that very tarball to npm, after an approval (environment "npm").
#
# One-time setup on npmjs.com: package "@getfurio/cli" → Settings → Trusted publisher → GitHub Actions,
# repository getfurio/furio, workflow release.yml, environment npm.
# Actions are pinned to a commit (a tag can be moved); Dependabot keeps them current.
name: release

on:
  push:
    # Release tags only: moving v0 (the Action's floating tag) publishes nothing.
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Every branch, to check that the tag is on main.
          fetch-depth: 0

      - name: Tag is on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::Tag $GITHUB_REF_NAME is not on main: releases are cut from main only"; exit 1; }

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Tag matches the CLI version
        run: |
          version=$(node -p "require('./packages/cli/package.json').version")
          test "v$version" = "$GITHUB_REF_NAME" || {
            echo "::error::Tag $GITHUB_REF_NAME does not match packages/cli version $version"; exit 1; }

      - name: Check and build
        run: |
          pnpm check
          pnpm build
          pnpm smoke

      # pnpm pack turns workspace: versions into real ones; npm publishes that exact tarball.
      - name: Pack
        run: cd packages/cli && pnpm pack --pack-destination "$RUNNER_TEMP/release"

      # No package ships without being run: install the tarball from scratch and use it.
      - name: Smoke test the tarball
        run: |
          cd "$RUNNER_TEMP" && npm init -y > /dev/null && npm install ./release/getfurio-cli-*.tgz
          npx @getfurio/cli --version
          npx @getfurio/cli validate "$GITHUB_WORKSPACE/examples/demo/shop-api"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tarball
          path: ${{ runner.temp }}/release/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Protected in the repo settings: release tags only, and a reviewer approves each release.
    environment: npm
    permissions:
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tarball
          path: release

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Publish
        run: npm publish release/getfurio-cli-*.tgz --provenance --access public
